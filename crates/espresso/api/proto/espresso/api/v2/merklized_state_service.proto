syntax = "proto3";

package espresso.api.v2;

import "google/api/annotations.proto";
import "espresso/api/v2/types/merkle.proto";

message GetBlockStatePathRequest {
  // Required, the block height to look up. A snapshot at height `h` commits to the headers below
  // `h`, so a key at or above the snapshot height gets a non-membership path
  optional uint64 key = 1;

  // Snapshot the tree as of this block height
  optional uint64 height = 2;

  // Snapshot the tree at this root, TaggedBase64 `MERKLE_COMM~`
  optional string commit = 3;
}

message GetFeeStatePathRequest {
  // Required, the account to look up, `0x`-prefixed hex
  optional string address = 1;

  // Snapshot the tree as of this block height
  optional uint64 height = 2;

  // Snapshot the tree at this root, TaggedBase64 `MERKLE_COMM~`
  optional string commit = 3;
}

message GetLatestFeeBalanceRequest {
  // Required, the account to look up, `0x`-prefixed hex
  optional string address = 1;
}

message FeeBalanceResponse {
  // Balance in wei (decimal string), zero for an account the tree holds no entry for
  string balance = 1;
}

message GetStateHeightRequest {}

message StateHeightResponse {
  // Height of the newest block whose merklized state is persisted. A snapshot above it is not
  // found
  uint64 height = 1;
}

service MerklizedStateService {
  // Get the Merkle path to one leaf of the block merkle tree, which commits to past block
  // headers. Exactly one of height or commit selects the snapshot. None or both is a 400
  rpc GetBlockStatePath(GetBlockStatePathRequest) returns (MerklePath) {
    option (google.api.http) = {get: "/v2/merklized-state/block/path"};
  }

  // Get the Merkle path to one account of the fee merkle tree, which holds the fee balances.
  // Exactly one of height or commit selects the snapshot. None or both is a 400
  rpc GetFeeStatePath(GetFeeStatePathRequest) returns (MerklePath) {
    option (google.api.http) = {get: "/v2/merklized-state/fee/path"};
  }

  // Get an account's fee balance in the newest persisted state
  rpc GetLatestFeeBalance(GetLatestFeeBalanceRequest) returns (FeeBalanceResponse) {
    option (google.api.http) = {get: "/v2/merklized-state/fee/balance"};
  }

  // Get the height of the newest persisted merklized state, which every tree shares
  rpc GetStateHeight(GetStateHeightRequest) returns (StateHeightResponse) {
    option (google.api.http) = {get: "/v2/merklized-state/height"};
  }
}
