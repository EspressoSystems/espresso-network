syntax = "proto3";

package espresso.api.v2;

// Types shared by more than one v2 service. Kept minimal on purpose: domain types live in the
// proto of the service that owns them.

message BLSPublicKey {
  // TaggedBase64, e.g. "BLS_VER_KEY~AAA..."
  string key = 1;
}

message SchnorrPublicKey {
  // TaggedBase64, e.g. "SCHNORR_VER_KEY~AAA..."
  string key = 1;
}

message PeerConnectInfo {
  // "host:port", with an IPv6 literal left unbracketed as v1 writes it
  string p2p_addr = 1;

  // X25519 public key for cliquenet, TaggedBase64 rather than x25519's own base58
  string x25519_key = 2;
}

message StakeTableEntry {
  BLSPublicKey stake_key = 1;

  // 0x-prefixed hex quantity, as v1 renders a U256
  string stake_amount = 2;
}

message PeerConfig {
  StakeTableEntry stake_table_entry = 1;

  SchnorrPublicKey state_ver_key = 2;

  // Absent for a peer that published no network address
  optional PeerConnectInfo connect_info = 3;
}
