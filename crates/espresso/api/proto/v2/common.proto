syntax = "proto3";

package espresso.api.v2;

// Types shared by more than one v2 service. Kept minimal on purpose: domain types live in the
// proto of the service that owns them.

message BLSPublicKey {
  // TaggedBase64, e.g. "BLS_VER_KEY~AAA..."
  string key = 1;
}

message SchnorrPublicKey {
  // TaggedBase64, e.g. "SCHNORR_VER_KEY~AAA..."
  string key = 1;
}
