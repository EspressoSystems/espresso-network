syntax = "proto3";

package espresso.api.v2;

import "google/api/annotations.proto";

message GetHotshotConfigRequest {}

// The consensus parameters this node runs with. The bootstrap peer lists of the v1 endpoint are
// not repeated here; stake tables have their own endpoints
message HotshotConfigResponse {
  // Share of stake that must be online before consensus starts, as a fraction
  uint64 start_threshold_numerator = 1;

  uint64 start_threshold_denominator = 2;

  uint64 num_nodes_with_stake = 3;

  uint64 da_staked_committee_size = 4;

  uint64 next_view_timeout_ms = 5;

  uint64 view_sync_timeout_ms = 6;

  // Longest a leader waits for a builder's block before proposing without one
  uint64 builder_timeout_ms = 7;

  // Wait before requesting the data behind a proposal from peers
  uint64 data_request_delay_ms = 8;

  repeated string builder_urls = 9;

  // View from which this node proposes a consensus upgrade
  uint64 start_proposing_view = 10;

  uint64 stop_proposing_view = 11;

  // View from which this node votes for a consensus upgrade
  uint64 start_voting_view = 12;

  uint64 stop_voting_view = 13;

  // Unix seconds from which this node proposes a consensus upgrade
  uint64 start_proposing_time = 14;

  // Unix seconds
  uint64 stop_proposing_time = 15;

  // Unix seconds from which this node votes for a consensus upgrade
  uint64 start_voting_time = 16;

  // Unix seconds
  uint64 stop_voting_time = 17;

  // Blocks per epoch; zero before proof of stake
  uint64 epoch_height = 18;

  uint64 epoch_start_block = 19;

  // Stake table size the light-client circuit is built for
  uint64 stake_table_capacity = 20;

  // Iterations of the DRB computation
  uint64 drb_difficulty = 21;

  // Iterations of the DRB computation after the DRB upgrade
  uint64 drb_upgrade_difficulty = 22;
}

message GetEnvRequest {}

message EnvVar {
  string name = 1;

  // Empty when the variable is not set
  string value = 2;
}

message EnvResponse {
  // Only the variables the node's public-env-vars.toml allowlists
  repeated EnvVar variables = 1;
}

message GetRuntimeConfigRequest {}

message NodeIdentity {
  optional string node_name = 1;

  optional string node_description = 2;

  optional string company_name = 3;

  optional string company_website = 4;

  // ISO 3166-1 alpha-2
  optional string country_code = 5;

  optional double latitude = 6;

  optional double longitude = 7;

  optional string operating_system = 8;

  // Binary name and version unless the operator overrode it
  optional string node_type = 9;

  optional string network_type = 10;
}

enum StorageBackend {
  STORAGE_BACKEND_UNSPECIFIED = 0;
  STORAGE_BACKEND_SQL = 1;
  STORAGE_BACKEND_FS = 2;
  // Filesystem storage with default settings, used when no storage flag was given
  STORAGE_BACKEND_FS_DEFAULT = 3;
}

// The node's effective runtime configuration: CLI flags, environment and defaults merged. Tuning
// parameters and the genesis stay on v1; secrets are never served
message RuntimeConfigResponse {
  bool is_da = 1;

  NodeIdentity identity = 2;

  StorageBackend storage_backend = 3;

  // Path or URL the genesis was loaded from
  string genesis_file = 4;

  optional string public_api_url = 5;

  repeated string builder_urls = 6;

  string state_relay_server_url = 7;

  repeated string state_peers = 8;

  repeated string config_peers = 9;

  string orchestrator_url = 10;

  string cdn_endpoint = 11;

  string cliquenet_bind_address = 12;

  optional string cliquenet_advertise_address = 13;

  string libp2p_bind_address = 14;

  optional string libp2p_advertise_address = 15;

  // libp2p multiaddrs
  repeated string libp2p_bootstrap_nodes = 16;

  // How many L1 RPC endpoints are configured; the URLs can carry credentials and are not served
  uint64 l1_provider_count = 17;

  uint64 l1_ws_provider_count = 18;
}

service ConfigService {
  // Get the consensus parameters this node runs with
  rpc GetHotshotConfig(GetHotshotConfigRequest) returns (HotshotConfigResponse) {
    option (google.api.http) = {get: "/v2/config/hotshot"};
  }

  // Get the public environment variables set for this node
  rpc GetEnv(GetEnvRequest) returns (EnvResponse) {
    option (google.api.http) = {get: "/v2/config/env"};
  }

  // Get the node's effective runtime configuration
  rpc GetRuntimeConfig(GetRuntimeConfigRequest) returns (RuntimeConfigResponse) {
    option (google.api.http) = {get: "/v2/config/runtime"};
  }
}
