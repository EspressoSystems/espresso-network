syntax = "proto3";

package espresso.api.v2;

import "google/api/annotations.proto";
import "v2/common.proto";

message GetBlockHeightRequest {}

message BlockHeightResponse {
  // Height of the latest decided block
  uint64 height = 1;
}

message GetSuccessRateRequest {}

message SuccessRateResponse {
  // Fraction of views in which this node decided a block. Node-local, not a network measure.
  // Zero before the node has seen any view, so a fresh node reports zero rather than an
  // undefined ratio.
  double rate = 1;
}

message GetTimeSinceLastDecideRequest {}

message TimeSinceLastDecideResponse {
  // Seconds elapsed since this node last decided a block
  uint64 seconds = 1;
}

message GetNodeKeysRequest {}

message NodeKeysResponse {
  // Ethereum account associated with this node, 0x-prefixed hex
  optional string eth_account = 1;

  BLSPublicKey consensus_key = 2;

  SchnorrPublicKey state_ver_key = 3;

  // X25519 public key for cliquenet, TaggedBase64
  optional string x25519_key = 4;

  // Cliquenet address peers dial, host:port: the configured advertise address, unset when none is configured
  optional string p2p_addr = 5;
}

message GetUpcomingLeadersRequest {
  // Views past the current one to list: 8 when absent, at most 64
  optional uint32 count = 1;
}

message ViewLeader {
  uint64 view = 1;

  // Consensus key of the view's leader
  BLSPublicKey key = 2;
}

message UpcomingLeadersResponse {
  // The view this node is in
  uint64 view = 1;

  // The leaders of the views after `view`, in view order, by the stake table of the epoch the
  // node is in: a view in the next epoch is listed with this epoch's leader for it
  repeated ViewLeader leaders = 2;
}

service StatusService {
  // Get the height of the latest decided block
  rpc GetBlockHeight(GetBlockHeightRequest) returns (BlockHeightResponse) {
    option (google.api.http) = {get: "/v2/status/block-height"};
  }

  // Get the fraction of views in which this node decided a block
  rpc GetSuccessRate(GetSuccessRateRequest) returns (SuccessRateResponse) {
    option (google.api.http) = {get: "/v2/status/success-rate"};
  }

  // Get the seconds elapsed since this node last decided a block
  rpc GetTimeSinceLastDecide(GetTimeSinceLastDecideRequest) returns (TimeSinceLastDecideResponse) {
    option (google.api.http) = {get: "/v2/status/time-since-last-decide"};
  }

  // Get the node's public keys
  rpc GetNodeKeys(GetNodeKeysRequest) returns (NodeKeysResponse) {
    option (google.api.http) = {get: "/v2/status/keys"};
  }

  // Get the leaders of the views after the current one, for a client choosing which node to
  // submit to. The leader of a view builds its block when it sees the previous view's proposal,
  // so a transaction for it has to reach that node two views ahead.
  rpc GetUpcomingLeaders(GetUpcomingLeadersRequest) returns (UpcomingLeadersResponse) {
    option (google.api.http) = {get: "/v2/status/upcoming-leaders"};
  }
}
