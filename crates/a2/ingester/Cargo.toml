[package]
name        = "ingester"
description = "Copies the chain a consensus node decides into its deployment's store, and does the deployment's derived work"
version     = { workspace = true }
authors     = { workspace = true }
edition     = { workspace = true }

[dependencies]
alloy                 = { workspace = true }
anyhow                = { workspace = true }
async-trait           = { workspace = true }
bincode               = { workspace = true }
bytes                 = { workspace = true }
catchup-api           = { workspace = true }
chain-api             = { workspace = true }
chain-store           = { workspace = true, features = ["remote"] }
clap                  = { workspace = true }
committable           = { workspace = true }
consensus-api         = { workspace = true }
either                = { workspace = true }
espresso-genesis      = { workspace = true }
espresso-types        = { workspace = true, features = ["node"] }
futures               = { workspace = true }
hotshot-contract-adapter = { workspace = true }
hotshot-types         = { workspace = true }
jf-advz               = { workspace = true }
jf-merkle-tree-compat = { workspace = true }
light-client          = { workspace = true }
membership            = { workspace = true }
rand                  = { workspace = true }
serde                 = { workspace = true }
thiserror             = { workspace = true }
tokio                 = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tonic                 = { workspace = true, features = ["tls-ring", "tls-webpki-roots"] }
tracing               = { workspace = true }
tracing-subscriber    = { workspace = true, features = ["env-filter", "json"] }
url                   = { workspace = true }
versions              = { workspace = true }

[dev-dependencies]
api-service           = { path = "../api-service" }
async-lock            = { workspace = true }
bitvec                = { workspace = true }
chain-store           = { workspace = true, features = ["testing"] }
espresso-types        = { workspace = true, features = ["testing"] }
hotshot-query-service = { workspace = true, features = ["testing"] }
hotshot-query-service-types = { workspace = true }
test-utils            = { workspace = true }
tokio                 = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
