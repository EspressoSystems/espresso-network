syntax = "proto3";

package espresso.consensus.v1;

// The chain as a consensus node decides it, for its API service's store.
//
// Entries carry the fields a storage instance acts on as protobuf fields, and the consensus objects
// themselves in `Body`, in the encoding consensus nodes exchange.
service DecideLog {
  // The decided entries the node keeps, and those it decides from now on, shared out among the
  // open subscriptions: each entry, and each payload that joins an entry later, goes to one of
  // them, whichever asks for the next. An entry or payload sent to a subscription that ends
  // before the entry is acknowledged goes to another one. An entry whose `payload_size` is set is
  // followed by its payload, in chunks that add up to that size.
  //
  // Entries come mostly in height order, but within `FINALITY_VIEWS` views of the newest decide
  // a height that was missing can be decided later, and an entry sent without its payload can
  // get it later, as `PayloadAdded` followed by its chunks. An entry whose view is
  // `FINALITY_VIEWS` or more behind the newest decide's view gets neither; heights still missing
  // then, and payloads still missing, must come from elsewhere. Every subscription gets
  // `Progress`, the newest decide's view, whenever it advances, to tell when an entry is final.
  //
  // The stream starts with `Start`, naming the earliest entry the node still keeps; entries
  // before it must come from elsewhere too.
  //
  // Between entries, the stream sends what the API service serves besides the chain and the
  // node already has: the stake table of each epoch from the first entry's on, once the node
  // has built it, and the discovery records of the newest entry's epoch, again whenever the
  // node holds more of them.
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);

  // Frees the entries of the heights in the given ranges, and their payloads. The caller has
  // made them durable, or given up on their payloads.
  rpc Ack(AckRequest) returns (AckResponse);

  // The payloads of blocks the node has, before they are decided, shared out among the open
  // subscriptions as entries are: each goes to one of them, as a `PayloadHead` followed by its
  // chunks. The node votes on a block only once a subscriber has acknowledged its payload, with
  // `AckPayload`, as durable. A payload sent to a subscription that ends before it is
  // acknowledged goes to another one.
  rpc TakePayloads(TakePayloadsRequest) returns (stream PayloadOffer);

  // Reports a payload durable.
  rpc AckPayload(AckPayloadRequest) returns (AckResponse);
}

message TakePayloadsRequest {}

message PayloadOffer {
  oneof event {
    PayloadHead head = 1;
    PayloadChunk chunk = 2;
  }
}

// A payload, followed by its chunks.
message PayloadHead {
  // The view the block was proposed in.
  uint64 view = 1;

  // The block's VID commitment, as tagged base64.
  string commitment = 2;

  // The block's namespace table, as the header encodes it, to count the payload's transactions.
  bytes ns_table = 3;

  // The payload's size, which its chunks add up to.
  uint64 size = 4;
}

message AckPayloadRequest {
  uint64 view = 1;
  string commitment = 2;
}

message SubscribeRequest {}

message SubscribeResponse {
  oneof event {
    Start start = 1;
    Decided decided = 2;
    PayloadChunk payload_chunk = 3;
    PayloadAdded payload_added = 4;
    StakeTable stake_table = 5;
    ServiceRecords service_records = 6;
    Progress progress = 7;
  }
}

// The view of the newest decide.
message Progress {
  uint64 newest_view = 1;
}

// The stake table of an epoch.
message StakeTable {
  uint64 epoch = 1;

  // The table's entries, bincode-encoded as consensus nodes exchange them.
  bytes table = 2;
}

// The records the validators signed about their API services for an epoch, newest per
// validator, as the node holds them.
message ServiceRecords {
  uint64 epoch = 1;

  // Each a signed record, bincode-encoded as consensus nodes exchange it.
  repeated bytes records = 2;
}

// The payload of an entry sent earlier without it, followed by its chunks.
message PayloadAdded {
  uint64 height = 1;
  uint64 payload_size = 2;
}

message Start {
  // The earliest entry the node keeps; absent if it keeps none.
  optional uint64 earliest_height = 1;
}

message Decided {
  uint64 height = 1;
  uint64 view = 2;
  uint64 epoch = 3;

  // The leaf's commitment, and the commitment of the leaf before it, as tagged base64.
  string leaf_commitment = 4;
  string parent_commitment = 5;

  // The block's payload commitment, as tagged base64.
  string payload_commitment = 6;

  // The payload's size in bytes; absent if this node does not have the payload.
  optional uint64 payload_size = 7;

  Body body = 8;
}

// Consensus objects, each bincode-encoded as consensus nodes exchange them.
message Body {
  // The version of the encoding. This is version 1.
  uint32 format = 1;

  // The leaf, without its payload.
  bytes leaf = 2;

  // The `Certificate1` that certifies the leaf, always present.
  bytes cert1 = 3;

  // The `Certificate2` that decided the leaf, for the newest leaf of a decide; empty otherwise.
  bytes cert2 = 4;

  // The VID common data of the block; empty if this node did not have its share.
  bytes vid_common = 5;

  // The light client state update certificate of the epoch this block is the root of; empty if
  // it is no epoch root or this node did not have the certificate.
  bytes state_cert = 6;

  // The state after the block, as far as its header does not commit to it; absent if this node
  // did not validate the block.
  State state = 7;
}

// The parts of the state after a block that state catchup serves and its header only commits
// to, each bincode-encoded as consensus nodes exchange them.
message State {
  // The frontier of the block Merkle tree; empty if the tree is empty.
  bytes frontier = 1;

  // The chain config.
  bytes chain_config = 2;

  // Every reward balance, if they may differ from those of the parent block's state; absent if
  // they are the parent's.
  optional bytes rewards = 3;
}

message AckRequest {
  repeated HeightRange ranges = 1;
}

// The heights from `start` up to, not including, `end`.
message HeightRange {
  uint64 start = 1;
  uint64 end = 2;
}

message AckResponse {}

// A part of the payload announced by the `Decided` or `PayloadAdded` before it.
message PayloadChunk {
  bytes data = 1;
}

