[package]
name        = "chain-store"
description = "The record of the chain a deployment keeps"
version     = { workspace = true }
authors     = { workspace = true }
edition     = { workspace = true }

[features]
# The Postgres backend.
postgres = ["dep:sqlx"]
# The conformance suite every backend runs, and a throwaway Postgres server to run it against.
testing = ["dep:test-utils"]

[dependencies]
blake3        = { workspace = true }
object_store  = { workspace = true }
url           = { workspace = true }
app-tables = { workspace = true }
anyhow        = { workspace = true }
async-trait   = { workspace = true }
bincode       = { workspace = true }
bytes         = { workspace = true }
committable   = { workspace = true }
espresso-types = { workspace = true }
futures       = { workspace = true }
hotshot-query-service-types = { workspace = true }
hotshot-types = { workspace = true }
serde         = { workspace = true }
sqlx          = { workspace = true, optional = true }
test-utils    = { workspace = true, optional = true }
tokio         = { workspace = true, features = ["sync", "time", "rt"] }
tracing       = { workspace = true }

[dev-dependencies]
# Every backend, for the conformance suite.
chain-store    = { path = ".", features = ["postgres", "testing"] }
espresso-types = { workspace = true, features = ["testing"] }
test-utils     = { workspace = true }
tokio          = { workspace = true, features = ["full"] }
versions       = { workspace = true }

[lints]
workspace = true
