[package]
name        = "chain-store"
description = "The record of the chain an API service keeps, and the store service that serves it"
version     = { workspace = true }
authors     = { workspace = true }
edition     = { workspace = true }

[features]
# The Postgres backend.
postgres = ["dep:sqlx"]
# The client of the store service, a backend over gRPC.
remote = ["dep:prost", "dep:tonic", "dep:tonic-prost"]
# The store service, which serves a backend over gRPC.
service = ["dep:prost", "dep:tonic", "dep:tonic-prost"]
# The conformance suite every backend runs, and a throwaway Postgres server to run it against.
testing = ["dep:test-utils"]

[dependencies]
blake3        = { workspace = true }
object_store  = { workspace = true }
url           = { workspace = true }
app-tables = { workspace = true }
anyhow        = { workspace = true }
async-trait   = { workspace = true }
bincode       = { workspace = true }
bytes         = { workspace = true }
committable   = { workspace = true }
espresso-types = { workspace = true }
futures       = { workspace = true }
hotshot-types = { workspace = true }
prost         = { workspace = true, optional = true }
serde         = { workspace = true }
sqlx          = { workspace = true, optional = true }
test-utils    = { workspace = true, optional = true }
tokio         = { workspace = true, features = ["sync", "time", "rt"] }
tonic         = { workspace = true, optional = true }
tonic-prost   = { workspace = true, optional = true }
tracing       = { workspace = true }

[build-dependencies]
tonic-prost-build = { workspace = true }

[dev-dependencies]
# Every backend, for the conformance suite and the remote tests.
chain-store    = { path = ".", features = ["postgres", "remote", "service", "testing"] }
espresso-types = { workspace = true, features = ["testing"] }
test-utils     = { workspace = true }
tokio          = { workspace = true, features = ["full"] }
versions       = { workspace = true }
hotshot-query-service-types = { workspace = true }

[lints]
workspace = true
