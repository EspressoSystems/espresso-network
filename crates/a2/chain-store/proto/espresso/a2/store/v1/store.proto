syntax = "proto3";

package espresso.a2.store.v1;

// The chain store, served by the store service, the only process that writes to the database the
// store keeps its data in. Each call is one method of the store's backend, with values in the
// store's own encoding.
service Store {
  // Stores an item with its parts in one commit. What is stored already is kept, and nothing is
  // written below the floor.
  rpc Put(PutRequest) returns (Done);

  // Stores parts of a height in one commit, each unless the height has it or is below the floor.
  rpc PutParts(PutPartsRequest) returns (Done);

  rpc GetItem(HeightRequest) returns (MaybeBytes);

  rpc GetPart(PartRequest) returns (MaybeBytes);

  // The item of a height with the parts it has, in part order, read together; the payload only
  // if asked for.
  rpc GetRecord(RecordRequest) returns (RecordResponse);

  // The height of the item whose commitment in `column` is `value`; the earliest if several share
  // it.
  rpc HeightOf(HeightOfRequest) returns (MaybeHeight);

  // The newest height with an item.
  rpc Newest(Empty) returns (MaybeHeight);

  // The first height the store keeps; everything below it is pruned.
  rpc Floor(Empty) returns (Height);

  // Ranges of heights without an item, from `from` or the floor up to the newest height with one.
  rpc MissingItems(MissingRequest) returns (RangesResponse);

  // The newest range of heights without an item, at or above the floor and below the newest height
  // with one.
  rpc NewestGap(Empty) returns (MaybeRange);

  // Heights from `from` on that have an item but not `part`.
  rpc MissingParts(MissingPartsRequest) returns (HeightsResponse);

  // The value of a key in an application table.
  rpc AppGet(AppGetRequest) returns (MaybeBytes);

  // Entries of an application table between two keys, in bytewise key order, up to a limit.
  rpc AppEntries(AppEntriesRequest) returns (AppEntriesResponse);

  // Applies writes to the application tables, in order, in one commit.
  rpc AppWrite(AppWriteRequest) returns (Done);

  // The newest heights from `from` on, without their payloads: each new height, and each height
  // that gets new parts, followed by the bounds of the store, whenever the store changes. The
  // service reads each height once for all of its clients.
  rpc FollowTip(FollowTipRequest) returns (stream TipEvent);

  // Takes or renews a lease for a holder; says whether the holder holds it now.
  rpc Lease(LeaseRequest) returns (LeaseResponse);

  // Deletes everything below `height`, and raises the floor to it.
  rpc PruneBelow(HeightRequest) returns (Done);

  // A counter that rises after every committed write, by any writer: its value now, then each
  // new value. A reader that reconnects may have missed writes and looks again.
  rpc Changes(Empty) returns (stream Change);
}

enum Part {
  PART_PAYLOAD = 0;
  PART_VID_COMMON = 1;
  PART_CERT2 = 2;
  PART_STATE_CERT = 3;
}

enum Column {
  COLUMN_LEAF = 0;
  COLUMN_BLOCK = 1;
  COLUMN_PAYLOAD = 2;
}

message Empty {}

message Done {}

message PartData {
  Part part = 1;
  bytes data = 2;
}

message PutRequest {
  uint64 height = 1;

  // The commitments of the leaf, the block header and the payload, as tagged base64
  string leaf = 2;
  string block = 3;
  string payload = 4;

  // The encoded item
  bytes item = 5;

  repeated PartData parts = 6;
}

message PutPartsRequest {
  uint64 height = 1;
  repeated PartData parts = 2;
}

message HeightRequest {
  uint64 height = 1;
}

message RecordRequest {
  uint64 height = 1;
  bool payload = 2;
}

message PartRequest {
  uint64 height = 1;
  Part part = 2;
}

message HeightOfRequest {
  Column column = 1;
  string value = 2;
}

message MissingRequest {
  uint64 from = 1;
  uint64 limit = 2;
}

message MissingPartsRequest {
  Part part = 1;
  uint64 from = 2;
  uint64 limit = 3;
}

message MaybeBytes {
  optional bytes data = 1;
}

message MaybeHeight {
  optional uint64 height = 1;
}

message Height {
  uint64 height = 1;
}

message RecordResponse {
  // Absent if the height has no item.
  optional bytes item = 1;
  repeated PartData parts = 2;
}

message HeightRange {
  uint64 start = 1;
  uint64 end = 2;
}

message MaybeRange {
  optional HeightRange range = 1;
}

message RangesResponse {
  repeated HeightRange ranges = 1;
}

message HeightsResponse {
  repeated uint64 heights = 1;
}

message AppGetRequest {
  string table = 1;
  bytes key = 2;
}

message AppEntriesRequest {
  string table = 1;

  // The first key, and the key the entries end before, if any.
  bytes from = 2;
  optional bytes until = 3;

  // At most this many entries; the server may answer fewer.
  uint32 limit = 4;
}

message AppEntry {
  bytes key = 1;
  bytes value = 2;
}

message AppEntriesResponse {
  repeated AppEntry entries = 1;
}

// One write to an application table.
message AppTableWrite {
  string table = 1;
  oneof op {
    // Sets a key to a value.
    AppEntry put = 2;
    // Deletes the keys before this one.
    bytes delete_before = 3;
    // Deletes every key.
    Empty clear = 4;
  }
}

message AppWriteRequest {
  repeated AppTableWrite writes = 1;
}

message FollowTipRequest {
  uint64 from = 1;
}

message TipEvent {
  oneof event {
    TipHeight height = 1;
    TipBounds bounds = 2;
  }
}

// A height that is new, or has new parts: its item and its parts but the payload.
message TipHeight {
  uint64 height = 1;
  bytes item = 2;
  repeated PartData parts = 3;
}

// The newest height and the floor, after the heights sent before them.
message TipBounds {
  optional uint64 newest = 1;
  uint64 floor = 2;
}

message LeaseRequest {
  string name = 1;
  string holder = 2;
  uint64 ttl_ms = 3;
}

message LeaseResponse {
  bool held = 1;
}

message Change {
  uint64 counter = 1;
}
