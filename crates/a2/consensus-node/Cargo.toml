[package]
name        = "consensus-node"
description = "The a2 consensus node of the Espresso chain"
version     = { workspace = true }
authors     = { workspace = true }
edition     = { workspace = true }

[dependencies]
app-tables = { workspace = true }
membership = { workspace = true }
alloy                 = { workspace = true }
anyhow                = { workspace = true }
async-lock            = { workspace = true }
async-trait           = { workspace = true }
clap                  = { workspace = true }
bincode               = { workspace = true }
bytes                 = { workspace = true }
catchup-api           = { workspace = true }
committable           = { workspace = true }
consensus             = { workspace = true }
consensus-api         = { workspace = true }
consensus-store-redb  = { workspace = true }
dyn-clone             = { workspace = true }
espresso-genesis      = { workspace = true }
espresso-keyset       = { workspace = true }
hotshot-contract-adapter = { workspace = true }
http-client           = { workspace = true }
humantime             = { workspace = true }
espresso-types        = { workspace = true, features = ["node"] }
hotshot-types         = { workspace = true }
jf-merkle-tree-compat = { workspace = true }
serde                 = { workspace = true }
serde_json            = { workspace = true }
tokio                 = { workspace = true, features = ["macros", "rt-multi-thread"] }
tonic                 = { workspace = true, features = ["tls-ring", "tls-webpki-roots"] }
tracing               = { workspace = true }
tracing-subscriber    = { workspace = true, features = ["env-filter", "json"] }
url                   = { workspace = true }
vbs                   = { workspace = true }
versions              = { workspace = true }

[dev-dependencies]
axum           = { workspace = true }
espresso-types = { workspace = true, features = ["testing"] }
serde_json     = { workspace = true }
tempfile       = { workspace = true }
tokio          = { workspace = true }
versions       = { workspace = true }

[lints]
workspace = true
