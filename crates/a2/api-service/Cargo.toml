[package]
name        = "api-service"
description = "Serves the v2 API from the chain store"
version     = { workspace = true }
authors     = { workspace = true }
edition     = { workspace = true }

[dependencies]
alloy                       = { workspace = true }
anyhow                      = { workspace = true }
async-lock                  = { workspace = true }
async-trait                 = { workspace = true }
axum                        = { workspace = true }
bincode                     = { workspace = true }
bytes                       = { workspace = true }
chain-store                 = { workspace = true }
clap                        = { workspace = true }
committable                 = { workspace = true }
consensus-api               = { workspace = true }
consensus-node              = { workspace = true }
either                      = { workspace = true }
espresso-api                = { workspace = true }
espresso-genesis            = { workspace = true }
espresso-types              = { workspace = true, features = ["node"] }
futures                     = { workspace = true }
consensus                   = { workspace = true }
hotshot-query-service-types = { workspace = true }
hotshot-contract-adapter    = { workspace = true }
hotshot-types               = { workspace = true }
http-wire                   = { workspace = true, features = ["server"] }
indexmap                    = { workspace = true }
jf-merkle-tree-compat       = { workspace = true }
light-client                = { workspace = true }
parking_lot                 = { workspace = true }
prost                       = { workspace = true }
serde                       = { workspace = true }
serde_json                  = { workspace = true }
tagged-base64               = { workspace = true }
tokio                       = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tonic                       = { workspace = true, features = ["tls-ring", "tls-webpki-roots"] }
tonic-prost                 = { workspace = true }
tonic-reflection            = { workspace = true }
tower                       = { workspace = true, features = ["util"] }
tracing                     = { workspace = true }
tracing-subscriber          = { workspace = true, features = ["env-filter", "json"] }
url                         = { workspace = true }
versions                    = { workspace = true }

[build-dependencies]
tonic-prost-build = { workspace = true }

[dev-dependencies]
espresso-contract-deployer = { workspace = true }
http-client    = { workspace = true }
vbs            = { workspace = true }
bitvec         = { workspace = true }
chain-store    = { workspace = true, features = ["testing"] }
espresso-types = { workspace = true, features = ["testing"] }
hotshot-query-service = { workspace = true }
jf-merkle-tree-compat = { workspace = true }
reqwest        = { workspace = true }
serde_json     = { workspace = true }
tokio          = { workspace = true, features = ["test-util"] }
versions       = { workspace = true }

[lints]
workspace = true
