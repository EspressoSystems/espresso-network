[package]
name        = "api-service"
description = "Serves the v2 API from the chain store"
version     = { workspace = true }
authors     = { workspace = true }
edition     = { workspace = true }

[dependencies]
anyhow                      = { workspace = true }
async-trait                 = { workspace = true }
bincode                     = { workspace = true }
bytes                       = { workspace = true }
chain-store                 = { workspace = true }
clap                        = { workspace = true }
committable                 = { workspace = true }
consensus-api               = { workspace = true }
espresso-api                = { workspace = true }
espresso-types              = { workspace = true }
futures                     = { workspace = true }
hotshot-new-protocol        = { workspace = true }
hotshot-query-service-types = { workspace = true }
hotshot-types               = { workspace = true }
tagged-base64               = { workspace = true }
tokio                       = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tonic                       = { workspace = true }
tracing                     = { workspace = true }
tracing-subscriber          = { workspace = true, features = ["env-filter", "json"] }

[dev-dependencies]
chain-store    = { workspace = true, features = ["testing"] }
espresso-types = { workspace = true, features = ["testing"] }
reqwest        = { workspace = true }
serde_json     = { workspace = true }
versions       = { workspace = true }

[lints]
workspace = true
