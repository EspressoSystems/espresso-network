[package]
name = "hotshot-metrics"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
description = "The Metrics trait family, its no-op implementation and a Prometheus backend"

[features]
# The Prometheus backend. Off by default: hotshot-types is in the SP1 zkVM build (doc/cargo-features.md).
prometheus = ["dep:itertools", "dep:prometheus", "dep:snafu", "dep:tracing"]

[dependencies]
dyn-clone = { workspace = true }
itertools = { workspace = true, optional = true }
prometheus = { workspace = true, optional = true }
snafu = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
# Enables the backend for this crate's own tests.
hotshot-metrics = { path = ".", features = ["prometheus"] }
test-log = { workspace = true }

[lints]
workspace = true
