# Hooks run by `prek` (rust pre-commit). Tools come from `nix develop`.
repos:
  - repo: local
    hooks:
      - id: rustfmt
        name: Run rustfmt on changed files
        # cargo-fmt is slower, does not format all files, and doesn't allow passing file arguments
        entry: rustfmt
        language: system
        types_or: [rust]
        pass_filenames: true

      - id: cargo-sort
        name: Ensure Cargo.toml are sorted
        entry: cargo sort -g -w
        language: system
        types_or: [toml]
        pass_filenames: false

      - id: cargo-lock
        name: Ensure Cargo.lock is compatible with Cargo.toml
        entry: cargo update --workspace --verbose
        language: system
        types_or: [toml]
        pass_filenames: false

      - id: forge-fmt
        name: Enforce forge fmt
        entry: forge fmt
        language: system
        types_or: [solidity]
        pass_filenames: false

      - id: solhint
        name: Solidity linter
        entry: solhint 'contracts/{script,src,test}/**/*.sol'
        language: system
        types_or: [solidity]
        pass_filenames: true

      - id: prettier-fmt
        name: Enforce markdown formatting
        entry: prettier -w
        language: system
        types_or: [markdown]
        pass_filenames: true

      - id: spell-checking
        name: Spell checking
        # --force-exclude to exclude excluded files if they are passed as arguments
        entry: typos --force-exclude
        language: system
        pass_filenames: true
        # Add excludes to the .typos.toml file instead

      - id: nixpkgs-fmt
        name: nixpkgs-fmt
        entry: nixpkgs-fmt
        language: system
        types: [nix]
        pass_filenames: true

      - id: actions-lock
        name: Check the GitHub Actions lockfile covers every workflow
        # Offline and read-only, so it never needs network or auth. gh-actions-lock isn't in the
        # nix shell; skip without it and let the CI check catch it.
        entry: >-
          bash -c 'if ! gh extension list 2>/dev/null | grep -q github/gh-actions-lock; then
          echo "gh-actions-lock not installed, skipping (see justfile lock-actions)"; exit 0; fi;
          just lock-actions --verify-local || { echo "Run: just lock-actions"; exit 1; }'
        language: system
        files: ^\.github/workflows/
        pass_filenames: false
