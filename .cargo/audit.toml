[advisories]
ignore = [
    # Unfixed "Marvin" vulnerability in `RSA`, unused in sqlite dependency
    "RUSTSEC-2023-0071",
    # Still here because of `ark-relations` crate.
    "RUSTSEC-2025-0055",
    # `LruCache::pop()` leaves a dangling node when a stored key's `Drop` panics. Our direct `lru`
    # is 0.18.2 (patched); the only affected copy is lru 0.7.8 pinned by memoize, whose single use
    # here (`advz_scheme`) is keyed on `usize`. `usize` has no `Drop`, so the panic that arms this
    # cannot occur.
    "RUSTSEC-2026-0253",
    # crypto-bigint 0.5.5 timing variability. Pulled in by elliptic-curve 0.13 (k256, ecdsa,
    # alloy-signer, ethers-core); the fix is only in 0.7.6+, which needs elliptic-curve 0.14.
    # Latest alloy (2.5.0) still requires k256/elliptic-curve 0.13.
    # https://github.com/alloy-rs/alloy/issues/4445
    "RUSTSEC-2026-0387",
]
