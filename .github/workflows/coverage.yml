name: Coverage

on:
  schedule:
    - cron: "0 0 * * 1"
  push:
    branches:
      - main
      - release-*
  workflow_dispatch:

concurrency:
  # ensure non-PR jobs run in parallel
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COVERAGE_RUSTFLAGS: >
    -Zprofile -Ccodegen-units=1 -Cinline-threshold=0 -Clink-dead-code -Coverflow-checks=off -Cpanic=abort
    -Zpanic_abort_tests -Cdebuginfo=2 --cfg hotshot_example --cfg tokio_unstable
  # `RUSTFLAGS`/`RUSTDOCFLAGS` replace `build.rustflags` from `.cargo/config.toml` rather than adding to it, so
  # `--cfg tokio_unstable` has to be repeated here; without it `process-metrics` drops the blocking-pool metrics.
  COVERAGE_RUSTDOCFLAGS: >
    -Zprofile -Ccodegen-units=1 -Cinline-threshold=0 -Clink-dead-code -Coverflow-checks=off -Cpanic=abort
    -Zpanic_abort_tests --cfg tokio_unstable
  CARGO_TEST_CMD: >
    cargo +nightly test --locked --all-features --no-fail-fast --release --workspace --exclude contract-bindings
    --exclude gen-vk-contract --exclude hotshot-contract-adapter --exclude diff-test-hotshot

jobs:
  code-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - uses: ./.github/actions/install-postgres
      - uses: ./.github/actions/install-foundry

      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly

      - name: Enable Rust Caching
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-') }}

      # Separate build step for easier identification of failures and timings.
      - name: Build tests for coverage
        run: |
          $CARGO_TEST_CMD --no-run
        env:
          # Do not exceed the memory limit of the public github runner during cargo build.
          CARGO_BUILD_JOBS: "2"
          CARGO_INCREMENTAL: "0"
          RUSTFLAGS: ${{ env.COVERAGE_RUSTFLAGS }}
          RUSTDOCFLAGS: ${{ env.COVERAGE_RUSTDOCFLAGS }}

      - name: Run tests with coverage
        run: |
          $CARGO_TEST_CMD -- --skip service::test::test_
        env:
          CARGO_INCREMENTAL: "0"
          RUSTFLAGS: ${{ env.COVERAGE_RUSTFLAGS }}
          RUSTDOCFLAGS: ${{ env.COVERAGE_RUSTDOCFLAGS }}

      - uses: alekitto/grcov@a35287df135f3ad96ac80260c38ef78b71bdb8df # v0.2
        with:
          config: .github/grcov.yml
        id: coverage

      - name: Coveralls upload
        uses: coverallsapp/github-action@09b709cf6a16e30b0808ba050c7a6e8a5ef13f8d # v1.2.5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ${{ steps.coverage.outputs.report }}
