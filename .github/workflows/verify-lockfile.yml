# Fails when .github/workflows/actions.lock is out of sync with the workflows,
# or a locked commit no longer verifies upstream.
name: Verify actions lockfile

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # A precompiled extension can only be pinned to a release tag. v0.4.0 is an immutable
      # release, and the lockfile format (v0.0.3) needs at least this version.
      - run: gh extension install github/gh-actions-lock --pin v0.4.0
      # The compile-metrics local actions call remote actions, which a `./` path can't lock.
      - run: gh actions-lock --verify --ignore-local-actions
