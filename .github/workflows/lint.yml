name: Lint

on:
  push:
    branches:
      - main
      - release-*
    tags:
      # MAJOR.MINOR.PHASE.PATCH
      - "[0-9]*.[0-9]*.[0-9]*.[0-9]*"
  pull_request:
    branches:
  workflow_dispatch:

concurrency:
  # ensure non-PR jobs run in parallel
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"

jobs:
  cargo-sort:
    name: cargo sort
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-sort

      - name: Check workspace Cargo.toml sort order
        run: cargo sort --check --grouped --workspace

  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt
      - uses: taiki-e/install-action@just

      - name: Check formatting
        run: just fmt && git diff --exit-code

  clippy-postgres:
    name: clippy (postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-') }}

      - name: Run clippy
        run: |
          cargo clippy --workspace --exclude espresso-node-sqlite --exclude espresso-dev-node --features testing --all-targets --keep-going -- -D warnings

  clippy-embedded:
    name: clippy (embedded-db)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-') }}

      - name: Run clippy
        run: |
          cargo clippy --workspace --features "embedded-db testing" --all-targets --keep-going -- -D warnings

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@just

      # `scripts/compile-metrics` and `scripts/nextest-ci` decide what CI reports and what it
      # alerts on, and no workflow ran their tests. `py::lint` and `py::check` still do not run
      # here: both need a tool installed, and nextest-ci has lint violations that belong in
      # their own change.
      - uses: astral-sh/setup-uv@v6

      - name: Run the script tests
        run: just py::test

  protos:
    name: protos
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The compatibility check diffs against the merge base with the PR's base branch.
          fetch-depth: 0
      # Pinned by commit: a third-party action's tag can be moved.
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          # Keep in step with the `buf` the nix dev shell provides, so `buf format` agrees
          # locally and in CI.
          version: 1.72.0
          setup_only: true
      - uses: taiki-e/install-action@just

      # A changed proto must keep the wire and protoJSON encoding of what it replaces.
      - name: Check the v2 protos' formatting and backward compatibility
        env:
          BASE: origin/${{ github.base_ref }}
        run: just proto-check "$BASE"

  allocator-patches:
    name: allocator patches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # build-allocators.yml only triggers on changes to the patches themselves, so a PR editing
      # the files they patch breaks them silently and the failure surfaces on a release tag build.
      - name: Check the allocator patches still apply
        run: |
          for p in build-support/allocator-patches/*.patch; do
            git apply --check "$p" || { echo "::error file=$p::patch no longer applies; regenerate it"; exit 1; }
          done
