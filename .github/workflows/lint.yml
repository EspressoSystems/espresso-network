name: Lint

on:
  push:
    branches:
      - main
      - release-*
    tags:
      # MAJOR.MINOR.PHASE.PATCH
      - "[0-9]*.[0-9]*.[0-9]*.[0-9]*"
  pull_request:
    branches:
  workflow_dispatch:

concurrency:
  # ensure non-PR jobs run in parallel
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"

jobs:
  cargo-sort:
    name: cargo sort
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-sort

      - name: Check workspace Cargo.toml sort order
        run: cargo sort --check --grouped --workspace

  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: rustfmt
      - uses: taiki-e/install-action@53aaa72a1fed2d5b9189d6d54c38e29bf9be2ab9 # just

      - name: Check formatting
        run: just fmt && git diff --exit-code

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-') }}

      - name: Run clippy
        run: |
          cargo clippy --workspace --features testing --all-targets --keep-going -- -D warnings
          cargo clippy -p slow-tests --features sqlite --all-targets --keep-going -- -D warnings

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@53aaa72a1fed2d5b9189d6d54c38e29bf9be2ab9 # just

      # `scripts/compile-metrics` and `scripts/nextest-ci` decide what CI reports and what it
      # alerts on, and no workflow ran their tests. `py::lint` and `py::check` still do not run
      # here: both need a tool installed, and nextest-ci has lint violations that belong in
      # their own change.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"

      - name: Run the script tests
        run: just py::test

  claude-gh:
    name: claude-gh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@53aaa72a1fed2d5b9189d6d54c38e29bf9be2ab9 # just
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"

      - name: Lint, type-check and test claude-gh
        run: |
          just claude::fmt --check
          just claude::lint
          just claude::check
          just claude::test

  protos:
    name: protos
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The compatibility check diffs against the merge base with the PR's base branch.
          fetch-depth: 0
          filter: blob:none
      # Pinned by commit: a third-party action's tag can be moved.
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          # Keep in step with the `buf` the nix dev shell provides, so `buf format` agrees
          # locally and in CI.
          version: 1.72.0
          setup_only: true
      - uses: taiki-e/install-action@53aaa72a1fed2d5b9189d6d54c38e29bf9be2ab9 # just

      # A changed proto must keep the wire and protoJSON encoding of what it replaces.
      - name: Check the v2 protos' formatting and backward compatibility
        env:
          BASE: origin/${{ github.base_ref }}
        run: just proto-check "$BASE"

  allocator-patches:
    name: allocator patches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # build-allocators.yml only triggers on changes to the patches themselves, so a PR editing
      # the files they patch breaks them silently and the failure surfaces on a release tag build.
      - name: Check the allocator patches still apply
        run: |
          for p in build-support/allocator-patches/*.patch; do
            git apply --check "$p" || { echo "::error file=$p::patch no longer applies; regenerate it"; exit 1; }
          done
