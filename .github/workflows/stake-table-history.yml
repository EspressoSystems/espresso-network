name: Stake Table History

# `next_stake_table_hash` is a consensus-validated header field, so the checked-in stake table
# history fixtures have to keep describing the real chains. The pin itself
# (`stake_table_history_pin`) is hermetic and runs in the normal test job; this workflow is the
# networked half: it confirms the fixtures are still a faithful prefix of live history and that
# history since the fixtures still applies cleanly.
#
# Scheduled rather than per-PR: it needs archive RPC credentials and talks to L1, so it must not
# gate merges.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: info
  CARGO_INCREMENTAL: "0"

jobs:
  history-is-current:
    name: history-is-current
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Install Protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - uses: rui314/setup-mold@v1

      - name: Enable Rust Caching
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: stake-table-history

      # Archive endpoints only. A pruning node answers eth_getLogs for ranges it no longer holds
      # with an empty result instead of an error; the test asserts the first known event is
      # present so that failure is loud rather than silent.
      - name: Check fixtures against live L1
        env:
          ESPRESSO_L1_ARCHIVE_RPC_MAINNET: ${{ secrets.ESPRESSO_L1_ARCHIVE_RPC_MAINNET }}
          ESPRESSO_L1_ARCHIVE_RPC_SEPOLIA: ${{ secrets.ESPRESSO_L1_ARCHIVE_RPC_SEPOLIA }}
        run: |
          if [ -z "$ESPRESSO_L1_ARCHIVE_RPC_MAINNET" ] || [ -z "$ESPRESSO_L1_ARCHIVE_RPC_SEPOLIA" ]; then
            echo "::error::ESPRESSO_L1_ARCHIVE_RPC_{MAINNET,SEPOLIA} secrets are not configured"
            exit 1
          fi
          cargo test -p espresso-types --lib stake_table_history_is_current \
            -- --ignored --nocapture
