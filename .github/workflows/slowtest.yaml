name: Slow Test

on:
  push:
    branches:
      - main
      - release-*
    tags:
      # YYYYMMDD
      - "20[0-9][0-9][0-1][0-9][0-3][0-9]*"
  schedule:
    - cron: "0 0 * * 1"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'main')}}

# Build test binary with `testing` feature, which requires `hotshot_example` config
env:
  CARGO_TERM_COLOR: always
  RUST_LOG: info,libp2p=off,node=error
  NEXTEST_PROFILE: slow
  CARGO_INCREMENTAL: "0"
  # Must equal the length of the `partition` matrix below.
  SLOW_TEST_SHARDS: "8"
  # Must equal the length of the `partition` matrix in espresso-dev-node-tests.
  DEV_NODE_SHARDS: "5"

jobs:
  slow-tests:
    name: slow-tests-${{ matrix.db }}-${{ matrix.partition }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [postgres, sqlite]
        partition: [1, 2, 3, 4, 5, 6, 7, 8]
        include:
          - db: postgres
            features: ""
          - db: sqlite
            features: --features embedded-db

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/free-disk-space

      - name: Install Protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - uses: ./.github/actions/install-foundry
      - uses: ./.github/actions/install-postgres
      - uses: taiki-e/install-action@just
      - uses: taiki-e/install-action@nextest
      - uses: rui314/setup-mold@v1

      - name: Enable Rust Caching
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: slow-tests-${{ matrix.db }}
          # All 8 shards share a key, so only one of them saves it.
          save-if: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-')) && matrix.partition == 1 }}

      - name: Build slow test
        run: just test-slow ${{ matrix.features }} --no-run

      # Tests are serialized within a shard (threads-required = num-cpus), so a
      # shard costs the sum of its tests. `count` deals the sorted test list
      # round-robin, which splits up the families of near-identical tests that
      # `hash` used to pile onto one shard.
      - name: Run slow test
        run: |
          just test-slow ${{ matrix.features }} --no-fail-fast \
            --partition count:${{ matrix.partition }}/${{ env.SLOW_TEST_SHARDS }}
        timeout-minutes: 60

      - name: Upload nextest JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slow-test-junit-${{ matrix.db }}-${{ matrix.partition }}
          if-no-files-found: ignore
          path: target/nextest/*/junit.xml
          retention-days: 1

      - name: Show available disk space
        if: always()
        run: df -h

  espresso-dev-node-tests:
    name: espresso-dev-node-tests-${{ matrix.partition }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/free-disk-space

      - name: Install Protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - uses: ./.github/actions/install-foundry
      - uses: ./.github/actions/install-postgres
      - uses: taiki-e/install-action@just
      - uses: taiki-e/install-action@nextest
      - uses: rui314/setup-mold@v1

      - name: Enable Rust Caching
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: espresso-dev-node-tests
          # All shards share a key, so only one of them saves it.
          save-if: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-')) && matrix.partition == 1 }}

      - name: Build slow test
        run: just test-dev-node --no-run

      # Each test runs a whole dev node. Four of the five used to run concurrently
      # on one runner and spent much of their time in view timeouts; one shard per
      # test gives each its own.
      - name: Run slow test
        run: |
          just test-dev-node --no-fail-fast \
            --partition count:${{ matrix.partition }}/${{ env.DEV_NODE_SHARDS }}
        timeout-minutes: 60

      - name: Upload nextest JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slow-test-junit-dev-node-${{ matrix.partition }}
          if-no-files-found: ignore
          path: target/nextest/*/junit.xml
          retention-days: 1

      - name: Show available disk space
        if: always()
        run: df -h

  nextest-report:
    needs: [slow-tests, espresso-dev-node-tests]
    runs-on: ubuntu-latest
    if: ${{ always() && !cancelled() }}
    # Reporter only: failures here must not fail the workflow.
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: Download JUnit artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: slow-test-junit-*
          path: junit-artifacts

      - name: Fetch main slow test stats
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/nextest-ci stats-fetch \
            --workflow slowtest.yaml \
            --artifact-name test-stats-slow \
            --out main-slow-stats.json

      - name: Render summary
        run: |
          args=(
            junit-artifacts
            --title "Slow Test"
            --pr-comment-out junit-artifacts/pr-comment.md
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          )
          if [ -s main-slow-stats.json ]; then
            args+=(--main-stats main-slow-stats.json)
          fi
          python3 scripts/nextest-ci report "${args[@]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Post/update PR comment
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: nextest-slow
          path: junit-artifacts/pr-comment.md
          delete: ${{ hashFiles('junit-artifacts/pr-comment.md') == '' }}

  publish-slow-test-stats:
    needs: [slow-tests, espresso-dev-node-tests]
    # always() so a single flaky shard on main does not freeze the history artifact.
    if: ${{ always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # Reporter only: failures here must not fail the workflow.
    continue-on-error: true
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Download JUnit artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: slow-test-junit-*
          path: junit-artifacts

      - name: Export stats
        run: |
          python3 scripts/nextest-ci stats-write \
            --junit-dir junit-artifacts \
            --sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --out slow-test-stats.json

      - uses: actions/upload-artifact@v7
        with:
          name: test-stats-slow
          path: slow-test-stats.json
          if-no-files-found: error
          retention-days: 90
