name: Slow Test

on:
  push:
    branches:
      - main
      - release-*
    tags:
      # YYYYMMDD
      - "20[0-9][0-9][0-1][0-9][0-3][0-9]*"
  schedule:
    - cron: "0 0 * * 1"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'main')}}

# Build test binary with `testing` feature, which requires `hotshot_example` config
env:
  CARGO_TERM_COLOR: always
  RUST_LOG: info,libp2p=off,node=error
  NEXTEST_PROFILE: slow
  CARGO_INCREMENTAL: "0"
  # Must equal the length of the `partition` matrix below.
  SLOW_TEST_SHARDS: "8"
  # Must equal the length of the `partition` matrix in espresso-dev-node-tests.
  DEV_NODE_SHARDS: "5"

jobs:
  slow-tests:
    name: slow-tests-${{ matrix.db }}-${{ matrix.partition }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [postgres, sqlite]
        partition: [1, 2, 3, 4, 5, 6, 7, 8]
        include:
          - db: postgres
            features: ""
          - db: sqlite
            features: --features embedded-db

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/free-disk-space

      - name: Install Protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - uses: ./.github/actions/install-foundry
      - uses: ./.github/actions/install-postgres
      - uses: taiki-e/install-action@just
      - uses: taiki-e/install-action@nextest
      - uses: rui314/setup-mold@v1

      - name: Enable Rust Caching
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: slow-tests-${{ matrix.db }}
          # All 8 shards share a key, so only one of them saves it.
          save-if: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-')) && matrix.partition == 1 }}

      - name: Build slow test
        run: just test-slow ${{ matrix.features }} --no-run

      # Tests are serialized within a shard (threads-required = num-cpus), so a
      # shard costs the sum of its tests. Pack by recorded cost instead of by
      # name hash; see `just update-slow-test-timings`.
      - name: Select tests for this shard
        run: |
          just list-slow ${{ matrix.features }} --message-format json > slow-test-list.json
          python3 scripts/nextest-ci shard \
            --list slow-test-list.json \
            --costs .config/slow-test-timings.json \
            --index ${{ matrix.partition }} \
            --count ${{ env.SLOW_TEST_SHARDS }} \
            --out slow-test-filter.txt

      - name: Run slow test
        run: |
          just test-slow-shard "$(cat slow-test-filter.txt)" \
            ${{ matrix.features }} --no-fail-fast
        timeout-minutes: 60

      - name: Upload nextest JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slow-test-junit-${{ matrix.db }}-${{ matrix.partition }}
          if-no-files-found: ignore
          path: target/nextest/*/junit.xml
          retention-days: 1

      - name: Show available disk space
        if: always()
        run: df -h

  espresso-dev-node-tests:
    name: espresso-dev-node-tests-${{ matrix.partition }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/free-disk-space

      - name: Install Protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - uses: ./.github/actions/install-foundry
      - uses: ./.github/actions/install-postgres
      - uses: taiki-e/install-action@just
      - uses: taiki-e/install-action@nextest
      - uses: rui314/setup-mold@v1

      - name: Enable Rust Caching
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: espresso-dev-node-tests
          # All shards share a key, so only one of them saves it.
          save-if: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-')) && matrix.partition == 1 }}

      - name: Build slow test
        run: just test-dev-node --no-run

      # Each test runs a whole dev node. Four of the five used to run concurrently on
      # one runner and spent much of their time in view timeouts; give each its own.
      - name: Select tests for this shard
        run: |
          just list-dev-node --message-format json > dev-node-list.json
          python3 scripts/nextest-ci shard \
            --list dev-node-list.json \
            --costs .config/slow-test-timings.json \
            --index ${{ matrix.partition }} \
            --count ${{ env.DEV_NODE_SHARDS }} \
            --out dev-node-filter.txt

      - name: Run slow test
        run: |
          just test-dev-node-shard "$(cat dev-node-filter.txt)" --no-fail-fast
        timeout-minutes: 60

      - name: Upload nextest JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slow-test-junit-dev-node-${{ matrix.partition }}
          if-no-files-found: ignore
          path: target/nextest/*/junit.xml
          retention-days: 1

      - name: Show available disk space
        if: always()
        run: df -h

  nextest-report:
    needs: [slow-tests, espresso-dev-node-tests]
    runs-on: ubuntu-latest
    if: ${{ always() && !cancelled() }}
    # Reporter only: failures here must not fail the workflow.
    continue-on-error: true
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Download JUnit artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: slow-test-junit-*
          path: junit-artifacts

      - name: Render summary
        run: |
          python3 scripts/nextest-ci report junit-artifacts --title "Slow Test" \
            >> "$GITHUB_STEP_SUMMARY"
