name: Slow Test

on:
  push:
    branches:
      - main
      - release-*
    tags:
      # YYYYMMDD
      - "20[0-9][0-9][0-1][0-9][0-3][0-9]*"
  schedule:
    - cron: "0 0 * * 1"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'main')}}

# Build test binary with `testing` feature, which requires `hotshot_example` config
env:
  CARGO_TERM_COLOR: always
  RUST_LOG: info,libp2p=off,node=error
  NEXTEST_PROFILE: slow
  CARGO_INCREMENTAL: "0"

jobs:
  slow-tests:
    name: slow-tests-${{ matrix.db }}-${{ matrix.partition }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [postgres, sqlite]
        partition: [1, 2, 3, 4, 5, 6, 7, 8]
        include:
          - db: postgres
            features: ""
          - db: sqlite
            features: --features embedded-db

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/free-disk-space

      - name: Install Protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - uses: ./.github/actions/install-foundry
      - uses: ./.github/actions/install-postgres
      - uses: taiki-e/install-action@just
      - uses: taiki-e/install-action@nextest
      - uses: rui314/setup-mold@v1

      - name: Enable Rust Caching
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: slow-tests-${{ matrix.db }}
          # All 8 shards share a key, so only one of them saves it.
          save-if: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-')) && matrix.partition == 1 }}

      - name: Build slow test
        run: |
          python3 scripts/compile-metrics sample-rss --out peak-rss.json -- \
            just test-slow ${{ matrix.features }} --no-run --timings

      # All 8 shards compile the same thing, so one of them reports for the set.
      - uses: ./.github/actions/compile-metrics
        if: matrix.partition == 1
        continue-on-error: true
        with:
          job: slow-tests-${{ matrix.db }}
          timing: target/cargo-timings/cargo-timing.html

      - name: Run slow test
        run: just test-slow ${{ matrix.features }} --no-fail-fast --partition hash:${{ matrix.partition }}/8
        # Tests are serialized within a shard (threads-required = num-cpus) and
        # hash partitioning is not cost-aware, so shard cost varies widely.
        timeout-minutes: 60

      - name: Show available disk space
        if: always()
        run: df -h

  espresso-dev-node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/free-disk-space

      - name: Install Protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - uses: ./.github/actions/install-foundry
      - uses: ./.github/actions/install-postgres
      - uses: taiki-e/install-action@just
      - uses: taiki-e/install-action@nextest
      - uses: rui314/setup-mold@v1

      - name: Enable Rust Caching
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: espresso-dev-node-tests
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-') }}

      - name: Build slow test
        run: |
          python3 scripts/compile-metrics sample-rss --out peak-rss.json -- \
            just test-dev-node --no-run --timings

      - uses: ./.github/actions/compile-metrics
        continue-on-error: true
        with:
          job: dev-node-tests
          timing: target/cargo-timings/cargo-timing.html

      - name: Run slow test
        run: just test-dev-node --no-fail-fast
        timeout-minutes: 60

      - name: Show available disk space
        if: always()
        run: df -h

  compile-metrics-report:
    name: Compile metrics
    needs: [slow-tests, espresso-dev-node-tests]
    if: ${{ always() && !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    # Reporter only: failures here must not fail the workflow.
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/compile-metrics-report
        with:
          workflow: slowtest.yaml
          baseline-artifact: compile-metrics-slowtest
          title: "Compile metrics: slow tests"

  publish-compile-metrics:
    needs: [slow-tests, espresso-dev-node-tests]
    # always() so one failed build job on main does not freeze the baseline artifact.
    if: ${{ always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # Reporter only: failures here must not fail the workflow.
    continue-on-error: true
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Download compile metrics
        uses: actions/download-artifact@v8
        with:
          pattern: compile-metrics-*
          path: metrics-artifacts

      - name: Merge compile metrics
        run: |
          python3 scripts/compile-metrics merge metrics-artifacts \
            --sha "${{ github.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --out compile-metrics.json

      - uses: actions/upload-artifact@v7
        with:
          name: compile-metrics-slowtest
          path: compile-metrics.json
          if-no-files-found: error
          retention-days: 90
