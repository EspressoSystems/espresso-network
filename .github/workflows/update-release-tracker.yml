name: Update Release Tracker

on:
  push:
    branches: [main, "release-*"]
  # Backport PRs open a minute after the merge to main that already refreshed the tracker.
  pull_request_target:
    types: [opened, reopened, closed]
    branches: ["release-*"]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: "Tracker issue number; empty refreshes every open tracker"
        required: false
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  # Runs off the default branch use this file from the release branch; re-run on the
  # default branch so the refresh always uses its workflow and `scripts/release`.
  redispatch:
    # Fork PRs are skipped; backport PRs come from same-repo `backport-*` branches.
    if: |
      github.ref_name != github.event.repository.default_branch &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.event.repository.default_branch }}
          ISSUE: ${{ inputs.issue }}
        run: gh workflow run update-release-tracker.yml --ref "$REF" ${ISSUE:+-f issue="$ISSUE"}

  refresh:
    if: |
      (github.ref_name == github.event.repository.default_branch &&
       (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       contains(github.event.issue.labels.*.name, 'release-tracker') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       (startsWith(github.event.comment.body, '/done ') ||
        startsWith(github.event.comment.body, '/skip ') ||
        startsWith(github.event.comment.body, '/unmark ')))
    # Job-level, so runs skipped by `if:` (outside comments, redispatches) never cancel a pending run.
    concurrency:
      group: release-tracker
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refresh the release tracker
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue || github.event.issue.number }}
        run: scripts/release refresh --ref "$GITHUB_REF" ${ISSUE:+--issue "$ISSUE"}
