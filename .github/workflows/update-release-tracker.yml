name: Update Release Tracker

on:
  push:
    branches: [main, "release-*"]
  # Backport PRs open a minute after the merge to main that already refreshed the tracker.
  pull_request_target:
    types: [opened, reopened, closed]
    branches: ["release-*"]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: "Tracker issue number; empty refreshes every open tracker"
        required: false
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  refresh:
    # Fork PRs are skipped; backport PRs come from same-repo `backport-*` branches.
    if: |
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       contains(github.event.issue.labels.*.name, 'release-tracker') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       (startsWith(github.event.comment.body, '/done ') ||
        startsWith(github.event.comment.body, '/skip ') ||
        startsWith(github.event.comment.body, '/unmark ')))
    # Job-level, so runs skipped by `if:` (outside comments, fork PRs) never cancel a pending run.
    concurrency:
      group: release-tracker
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      # Release-branch pushes and backport PRs run this file from the release branch;
      # render with main's script so the tracker body does not flip between versions.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Refresh the release tracker
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue || github.event.issue.number }}
        run: scripts/release refresh --ref "$GITHUB_REF" ${ISSUE:+--issue "$ISSUE"}
