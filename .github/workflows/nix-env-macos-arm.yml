# This workflow ensures that the nix dev env works on ARM based macOS.
name: Nix env macOS ARM

on:
  push:
    branches:
      - main
      - release-*
    tags:
      # MAJOR.MINOR.PHASE.PATCH
      - "[0-9]*.[0-9]*.[0-9]*.[0-9]*"
  pull_request:
    branches:
  workflow_dispatch:

concurrency:
  # ensure non-PR jobs run in parallel
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_LOG: info
  CARGO_INCREMENTAL: "0"

jobs:
  nix-env-macos-arm:
    timeout-minutes: 90
    runs-on: macos-latest
    steps:
      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.3

      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      # NOTE: no rust cache this isn't a time critical job

      - name: Activate nix env
        run: nix develop --accept-flake-config -c echo Ok

      - name: Check rust crates
        run: nix develop --accept-flake-config -c just check

      - name: Build contracts
        run: nix develop .#contracts --accept-flake-config -c forge build
