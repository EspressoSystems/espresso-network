name: Fuzz

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - inclusion_proofs
          - ns_table
          - vid_ns_shares
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Fuzz for five minutes
        # The prebuilt cargo-fuzz defaults to musl, which AddressSanitizer does not support
        run: >
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }}
          -- -max_total_time=300 -rss_limit_mb=2048

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
