name: Benchmark Build

on:
  push:
    branches:
      - bench*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_LOG: info,node=error

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: taiki-e/install-action@53aaa72a1fed2d5b9189d6d54c38e29bf9be2ab9 # just

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Enable Rust Caching
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-bench
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-') }}

      - name: Build
        # Build in release without `testing` feature, this should work without `hotshot_example` config.
        run: |
          cargo build --locked --release --features benchmarking --workspace

      - name: Build Espresso Dev Node
        # Espresso Dev Node currently requires testing feature, so it is built separately.
        run: |
          cargo build --locked --release --features benchmarking,testing --bin espresso-dev-node

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: x86_64-unknown-linux-gnu-services-bench
          retention-days: 1
          path: |
            target/release/orchestrator
            target/release/state-relay-server
            target/release/state-prover
            target/release/espresso-node
            target/release/cli
            target/release/submit-transactions
            target/release/utils
            target/release/reset-storage
            target/release/deploy
            target/release/keygen
            target/release/nasty-client
            target/release/espresso-dev-node
            target/release/pub-key
            target/release/espresso-bridge

  build-arm:
    runs-on: buildjet-16vcpu-ubuntu-2204-arm
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Enable Rust Caching
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-') }}

      - name: Build
        run: |
          cargo build --locked --release --features benchmarking --workspace

      - name: Build Espresso Dev Node
        # Espresso Dev Node currently requires testing feature, so it is built separately.
        run: |
          cargo build --locked --release --features benchmarking,testing --bin espresso-dev-node

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: aarch64-unknown-linux-gnu-services-bench
          retention-days: 1
          path: |
            target/release/orchestrator
            target/release/state-relay-server
            target/release/state-prover
            target/release/espresso-node
            target/release/cli
            target/release/submit-transactions
            target/release/reset-storage
            target/release/utils
            target/release/deploy
            target/release/keygen
            target/release/nasty-client
            target/release/espresso-dev-node
            target/release/pub-key
            target/release/espresso-bridge

  # NOTE: Each metadata step below lists both espresso-network and espresso-sequencer registries.
  # The espresso-sequencer images are DEPRECATED and provided only for backward compatibility.
  # They will be removed in a future release. Consumers should migrate to
  # ghcr.io/espressosystems/espresso-network/<service>.
  build-dockers:
    runs-on: ubuntu-latest
    needs: [build, build-arm]
    outputs:
      espresso-node-tag: ${{ steps.espresso-node.outputs.tags }}
      state-relay-server-tag: ${{ steps.state-relay-server.outputs.tags }}
      prover-service-tag: ${{ steps.prover-service.outputs.tags }}
      orchestrator-tag: ${{ steps.orchestrator.outputs.tags }}
      submit-transactions-tag: ${{ steps.submit-transactions.outputs.tags }}
      deploy-tag: ${{ steps.deploy.outputs.tags }}
      nasty-client-tag: ${{ steps.nasty-client.outputs.tags }}
      espresso-dev-node-tag: ${{ steps.espresso-dev-node.outputs.tags }}
      bridge-tag: ${{ steps.bridge.outputs.tags }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Download executables AMD
        uses: actions/download-artifact@v8
        with:
          name: x86_64-unknown-linux-gnu-services-bench
          path: target/amd64/release

      - name: Download executables ARM
        uses: actions/download-artifact@v8
        with:
          name: aarch64-unknown-linux-gnu-services-bench
          path: target/arm64/release

      - name: Setup Docker BuildKit (buildx)
        uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea # v3.8.0
        with:
          action: docker/setup-buildx-action@v3
          attempt_limit: 3
          attempt_delay: 10000

      - name: Login to Github Container Repo
        if: github.event_name != 'pull_request'
        uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea # v3.8.0
        with:
          action: docker/login-action@v3
          attempt_limit: 3
          attempt_delay: 10000
          with: |
            registry: ghcr.io
            username: ${{ github.repository_owner }}
            password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate espresso-node docker metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: espresso-node
        with:
          images: ghcr.io/espressosystems/espresso-network/espresso-node
          flavor: suffix=bench

      - name: Generate state-relay-server docker metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: state-relay-server
        with:
          images: |
            ghcr.io/espressosystems/espresso-network/state-relay-server
            ghcr.io/espressosystems/espresso-sequencer/state-relay-server
          flavor: suffix=bench

      - name: Generate prover-service docker metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: prover-service
        with:
          images: |
            ghcr.io/espressosystems/espresso-network/prover-service
            ghcr.io/espressosystems/espresso-sequencer/prover-service
          flavor: suffix=bench

      - name: Generate orchestrator docker metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: orchestrator
        with:
          images: |
            ghcr.io/espressosystems/espresso-network/orchestrator
            ghcr.io/espressosystems/espresso-sequencer/orchestrator
          flavor: suffix=bench

      - name: Generate submit-transactions docker metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: submit-transactions
        with:
          images: |
            ghcr.io/espressosystems/espresso-network/submit-transactions
            ghcr.io/espressosystems/espresso-sequencer/submit-transactions
          flavor: suffix=bench

      - name: Generate deploy metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: deploy
        with:
          images: |
            ghcr.io/espressosystems/espresso-network/deploy
            ghcr.io/espressosystems/espresso-sequencer/deploy
          flavor: suffix=bench

      - name: Generate nasty-client metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: nasty-client
        with:
          images: |
            ghcr.io/espressosystems/espresso-network/nasty-client
            ghcr.io/espressosystems/espresso-sequencer/nasty-client
          flavor: suffix=bench

      - name: Generate espresso-dev-node metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: espresso-dev-node
        with:
          images: |
            ghcr.io/espressosystems/espresso-network/espresso-dev-node
            ghcr.io/espressosystems/espresso-sequencer/espresso-dev-node
          flavor: suffix=bench

      - name: Generate bridge metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: bridge
        with:
          images: |
            ghcr.io/espressosystems/espresso-network/bridge
            ghcr.io/espressosystems/espresso-sequencer/bridge
          flavor: suffix=bench

      - name: Build and push espresso-node docker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./
          file: ./docker/espresso-node.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.espresso-node.outputs.tags }}
          labels: ${{ steps.espresso-node.outputs.labels }}

      # DEPRECATED: Push a legacy image with old binary names (sequencer, sequencer-postgres,
      # sequencer-sqlite) as symlinks to the new names. This will be removed in a future release.
      # Consumers should migrate to ghcr.io/espressosystems/espresso-network/espresso-node.
      - name: Generate legacy sequencer docker metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: legacy-sequencer
        with:
          images: ghcr.io/espressosystems/espresso-sequencer/sequencer
          flavor: suffix=bench

      - name: Build and push legacy sequencer docker with old binary names
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./
          file: ./docker/espresso-node-legacy.Dockerfile
          build-args: |
            BASE_IMAGE=ghcr.io/espressosystems/espresso-network/espresso-node:${{ steps.espresso-node.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.legacy-sequencer.outputs.tags }}
          labels: ${{ steps.legacy-sequencer.outputs.labels }}

      - name: Build and push state-relay-server docker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./
          file: ./docker/state-relay-server.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.state-relay-server.outputs.tags }}
          labels: ${{ steps.state-relay-server.outputs.labels }}

      - name: Build and push prover-service docker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./
          file: ./docker/prover-service.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.prover-service.outputs.tags }}
          labels: ${{ steps.prover-service.outputs.labels }}

      - name: Build and push orchestrator docker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./
          file: ./docker/orchestrator.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.orchestrator.outputs.tags }}
          labels: ${{ steps.orchestrator.outputs.labels }}

      - name: Build and push submit-transactions docker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./
          file: ./docker/submit-transactions.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.submit-transactions.outputs.tags }}
          labels: ${{ steps.submit-transactions.outputs.labels }}

      - name: Build and push deploy docker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./
          file: ./docker/deploy.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.deploy.outputs.tags }}
          labels: ${{ steps.deploy.outputs.labels }}

      - name: Build and push nasty-client docker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./
          file: ./docker/nasty-client.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.nasty-client.outputs.tags }}
          labels: ${{ steps.nasty-client.outputs.labels }}

      - name: Build and push espresso-dev-node docker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./
          file: ./docker/espresso-dev-node.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.espresso-dev-node.outputs.tags }}
          labels: ${{ steps.espresso-dev-node.outputs.labels }}
      - name: Build and push bridge docker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./
          file: ./docker/espresso-bridge.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.bridge.outputs.tags }}
          labels: ${{ steps.bridge.outputs.labels }}

  test-demo:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    needs: [build-dockers]
    steps:
      - uses: taiki-e/install-action@53aaa72a1fed2d5b9189d6d54c38e29bf9be2ab9 # just

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Pull docker images
        run: |
          docker pull ${{ needs.build-dockers.outputs.espresso-node-tag }}
          docker pull ${{ needs.build-dockers.outputs.state-relay-server-tag }}
          docker pull ${{ needs.build-dockers.outputs.prover-service-tag }}
          docker pull ${{ needs.build-dockers.outputs.orchestrator-tag }}
          docker pull ${{ needs.build-dockers.outputs.submit-transactions-tag }}
          docker pull ${{ needs.build-dockers.outputs.deploy-tag }}
          docker pull ${{ needs.build-dockers.outputs.nasty-client-tag }}
          docker pull ${{ needs.build-dockers.outputs.bridge-tag }}
      - name: Tag new docker images
        run: |
          docker tag ${{ needs.build-dockers.outputs.espresso-node-tag }} ghcr.io/espressosystems/espresso-network/espresso-node:main
          docker tag ${{ needs.build-dockers.outputs.state-relay-server-tag }} ghcr.io/espressosystems/espresso-network/state-relay-server:main
          docker tag ${{ needs.build-dockers.outputs.prover-service-tag }} ghcr.io/espressosystems/espresso-network/prover-service:main
          docker tag ${{ needs.build-dockers.outputs.orchestrator-tag }} ghcr.io/espressosystems/espresso-network/orchestrator:main
          docker tag ${{ needs.build-dockers.outputs.submit-transactions-tag }} ghcr.io/espressosystems/espresso-network/submit-transactions:main
          docker tag ${{ needs.build-dockers.outputs.deploy-tag }} ghcr.io/espressosystems/espresso-network/deploy:main
          docker tag ${{ needs.build-dockers.outputs.nasty-client-tag }} ghcr.io/espressosystems/espresso-network/nasty-client:main
          docker tag ${{ needs.build-dockers.outputs.bridge-tag }} ghcr.io/espressosystems/espresso-network/bridge:main

      - name: Test docker demo
        run: |
          just demo &
          timeout -v 600 scripts/smoke-test-demo | sed -e 's/^/smoke-test: /;'
