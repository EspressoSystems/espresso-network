name: Cargo features

on:
  push:
    branches:
      - main
      - release-*
    tags:
      # MAJOR.MINOR.PHASE.PATCH
      - "[0-9]*.[0-9]*.[0-9]*.[0-9]*"
  schedule:
    - cron: "0 0 * * 1"
  pull_request:
  workflow_dispatch:

concurrency:
  # ensure non-PR jobs run in parallel
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"

jobs:
  cargo-features:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        command:
          - just check-features-ci
          - just check-features-ci --tests
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/free-disk-space

      - name: Install Protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - uses: taiki-e/install-action@e54d1273511b8c2ffe93ae78b1b5d6652705222a # cargo-hack
      - uses: taiki-e/install-action@53aaa72a1fed2d5b9189d6d54c38e29bf9be2ab9 # just
      # Note: this job doesn't use a cache on purpose because it mostly compiles
      # the crates in this repo over and over again with different feature
      # combinations. The target directory gets really large. Adding caching
      # would not speed it up much and further contribute to our cache usage.
      - name: Check compilation feature combinations
        run: |
          ${{ matrix.command }}

  check-sp1-target:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@53aaa72a1fed2d5b9189d6d54c38e29bf9be2ab9 # just
      - uses: ./.github/actions/install-sp1

      - name: Check zkVM client crates for the SP1 target
        run: just check-sp1-target
