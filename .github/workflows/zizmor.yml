name: Zizmor

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Offline: no GitHub token needed. Config and ignored audits: .github/zizmor.yml.
      - name: Audit workflows
        run: pipx run zizmor==1.31.0 --offline --no-progress --min-severity medium --format plain .github
