name: Claude PR Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

# The three jobs run .github/claude from this run's merge commit, the same commit this workflow
# comes from; Claude's cwd is the PR head. The PR controls both. Fine: fork PRs and
# Dependabot-authored PRs are skipped, so the head branch lives in this repo and was pushed with
# write access.
jobs:
  review:
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    uses: ./.github/workflows/claude-job.yml
    permissions:
      contents: write
      pull-requests: write
      issues: write
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    with:
      job: review
      ref: ${{ github.sha }}
