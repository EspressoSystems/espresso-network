name: Install native demo deps
description: Install anvil (foundry), KeyDB, and the postgres server for the native demo

runs:
  using: composite
  steps:
    - uses: ./.github/actions/install-foundry
    - uses: ./.github/actions/install-postgres
    - shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        # keydb: copy the server out of the Docker Hub image (download.keydb.dev is unreachable)
        sudo apt-get install -y libsnappy1v5 libzstd1 libuuid1 libcurl4t64 libssl3t64
        mkdir -p /tmp/keydb/bin
        id=$(docker create eqalpha/keydb:x86_64_v6.3.4)
        docker cp -L "$id:/usr/local/bin/keydb-server" /tmp/keydb/bin/keydb-server
        docker rm "$id"
        echo "/tmp/keydb/bin" >> "$GITHUB_PATH"
        /tmp/keydb/bin/keydb-server --version
