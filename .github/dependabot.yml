version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # Group all updates together
    groups:
      all:
        patterns:
        - "*"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

  - package-ecosystem: "cargo"
    directories:
      - "/"
    groups:
      # The `all` group should include mainly updates from crates.io which are
      # more likely to succeed without intervention.
      ark:
        patterns:
          - "ark-*"
      jf:
        patterns:
          - "jf-*"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

  - package-ecosystem: "uv"
    directory: "/.github/claude"
    groups:
      all:
        patterns:
          - "*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
