[files]
extend-exclude = [
  ".env",
  "*.json",
  "**/*.pdf",
  "doc/*.svg",
  "doc/*.puml",
  "**/*.drawio",
  "contracts/lib",
  "contracts/rust/adapter/src/bindings",
  "crates/node-metrics/src/api/node_validator/v0/example_prometheus_metrics_output.txt",
  "crates/hotshot/types/src/light_client.rs",
  "lean",
  "crates/light-client-query-service/genesis/*.toml",
  "crates/staking-cli/tests/cli.rs",
  "sdks/go/types/common/consts.go",
  "crates/espresso/node/src/genesis.rs",
  "*.snap",
  "data/insta_snapshots",
  "data/genesis/**/*.toml",
  "scripts/network-bench/genesis.toml",
  "scripts/network-bench/bench-keys.jsonl",
  "tests/proof_of_stake.rs",
]

[default.extend-words]
Forgetten = "Forgetten"
# Serialized network config field name; renaming would break the wire format
bootrap = "bootrap"
# Common "spelling" of "type" in Rust/go
typ = "typ"
# Token Generation Event
tge = "tge"
# Rust crate name
bimap = "bimap"
# espresso-utils serialization module
ser = "ser"
