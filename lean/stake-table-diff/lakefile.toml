name = "stake-table-diff"
defaultTargets = ["StakeTableDiff", "check"]

# Test scaffolding, kept out of the verified packages: it depends on the
# implementation, and neither the implementation nor the specification depends
# on it.
[[require]]
name = "stake-table-spec"
path = "../stake-table-spec"

[[require]]
name = "stake-table-impl"
path = "../stake-table-impl"

[[lean_lib]]
name = "StakeTableDiff"

# Check the cases the node's corpus test writes against the implementation.
[[lean_exe]]
name = "check"
root = "CheckMain"

[leanOptions]
autoImplicit = false
