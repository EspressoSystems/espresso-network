[package]
name = "espresso-fuzz"
version = "0.0.0"
edition = { workspace = true }
publish = false

[package.metadata]
cargo-fuzz = true

[[bin]]
name = "vid_ns_shares"
path = "fuzz_targets/vid_ns_shares.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ns_table"
path = "fuzz_targets/ns_table.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inclusion_proofs"
path = "fuzz_targets/inclusion_proofs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stake_table_events"
path = "fuzz_targets/stake_table_events.rs"
test = false
doc = false
bench = false

[dependencies]
alloy = { workspace = true }
arbitrary = { version = "1", features = ["derive"] }
bincode = { workspace = true }
committable = { workspace = true }
espresso-types = { workspace = true }
hotshot-contract-adapter = { workspace = true }
hotshot-query-service-types = { workspace = true }
hotshot-types = { workspace = true }
jf-advz = { workspace = true }
libfuzzer-sys = "0.4"
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
vbs = { workspace = true }
versions = { workspace = true }
vid = { workspace = true }

[lints]
workspace = true
