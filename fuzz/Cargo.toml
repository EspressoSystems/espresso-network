[package]
name = "espresso-fuzz"
version = "0.0.0"
edition = { workspace = true }
publish = false

[package.metadata]
cargo-fuzz = true

[[bin]]
name = "vid_ns_shares"
path = "fuzz_targets/vid_ns_shares.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ns_table"
path = "fuzz_targets/ns_table.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inclusion_proofs"
path = "fuzz_targets/inclusion_proofs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "light_client_proofs"
path = "fuzz_targets/light_client_proofs.rs"
test = false
doc = false
bench = false

[dependencies]
anyhow = { workspace = true }
arbitrary = { version = "1", features = ["derive"] }
bincode = { workspace = true }
espresso-types = { workspace = true }
futures = { workspace = true }
hotshot-query-service-types = { workspace = true }
hotshot-types = { workspace = true }
jf-advz = { workspace = true }
libfuzzer-sys = "0.4"
light-client = { workspace = true, features = ["testing"] }
serde = { workspace = true }
serde_json = { workspace = true }
versions = { workspace = true }
vid = { workspace = true }

[lints]
workspace = true
