[package]
name = "espresso-fuzz"
version = "0.0.0"
edition = { workspace = true }
publish = false

[package.metadata]
cargo-fuzz = true

[[bin]]
name = "vid_ns_shares"
path = "fuzz_targets/vid_ns_shares.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ns_table"
path = "fuzz_targets/ns_table.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inclusion_proofs"
path = "fuzz_targets/inclusion_proofs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "merkle_catchup"
path = "fuzz_targets/merkle_catchup.rs"
test = false
doc = false
bench = false

[dependencies]
alloy = { workspace = true }
anyhow = { workspace = true }
arbitrary = { version = "1", features = ["derive"] }
ark-serialize = { workspace = true }
bincode = { workspace = true }
committable = { workspace = true }
espresso-types = { workspace = true }
hotshot-query-service-types = { workspace = true }
hotshot-types = { workspace = true }
jf-advz = { workspace = true }
jf-merkle-tree-compat = { workspace = true }
libfuzzer-sys = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
vid = { workspace = true }

[lints]
workspace = true
